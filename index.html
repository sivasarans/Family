<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House Construction Expenses Trackers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Poppins", sans-serif; }
    body { background: linear-gradient(135deg, #89f7fe, #66a6ff); min-height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #222; padding: 20px; }
    h1 { text-align: center; font-size: 1.8rem; font-weight: 700; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); margin-bottom: 15px; }
    .container { width: 100%; max-width: 1200px; background: rgba(255, 255, 255, 0.95); border-radius: 15px; box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2); overflow: hidden; padding: 10px; animation: fadeIn 1s ease-in-out; display: none; }
    iframe { width: 100%; height: 80vh; border: none; border-radius: 10px; }
    footer { margin-top: 15px; text-align: center; font-size: 0.9rem; color: rgba(255,255,255,0.8); }
    footer a { color: #fff; font-weight: 600; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .password-screen { background: rgba(255, 255, 255, 0.95); border-radius: 15px; box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2); padding: 30px 25px; text-align: center; max-width: 400px; width: 100%; animation: fadeIn 1s ease-in-out; }
    .password-screen h2 { color: #333; margin-bottom: 15px; font-size: 1.4rem; }
    .password-screen input { width: 80%; padding: 10px; font-size: 1rem; border: 2px solid #66a6ff; border-radius: 8px; outline: none; margin-bottom: 15px; text-align: center; transition: 0.3s; }
    .password-screen input:focus { border-color: #0044cc; }
    .password-screen button { background: linear-gradient(90deg, #66a6ff, #89f7fe); border: none; padding: 10px 25px; font-size: 1rem; border-radius: 8px; cursor: pointer; color: #fff; font-weight: 600; transition: 0.3s; }
    .password-screen button:hover { background: linear-gradient(90deg, #89f7fe, #66a6ff); }
    .error-message { color: red; font-size: 0.9rem; margin-top: 10px; display: none; }
    @media (max-width: 768px) { h1 { font-size: 1.4rem; } iframe { height: 70vh; } }
    @media (max-width: 480px) { body { padding: 10px; } h1 { font-size: 1.2rem; } .container { padding: 5px; } iframe { height: 65vh; } }
  </style>
</head>
<body>
  <h1>🏠 House Construction Expenses Tracker</h1>

  <div class="password-screen" id="passwordScreen">
    <h2>Enter Access Password</h2>
    <input type="password" id="passwordInput" placeholder="Enter password" />
    <br />
    <button onclick="checkPassword()">Access</button>
    <div class="error-message" id="errorMessage">Incorrect password. Please try again.</div>
  </div>

  <div class="container" id="mainContent">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT9SS2QzLsosOmZnLZVXzIbzJQyqiIoYbPWoCkMF2RnOvtREYGBMxtBVWnRv6JME6sg11Yn9lw2s2Ft/pubhtml?widget=trueIFRAME_SECRET_URL_PLACEHOLDERamp;headers=false" allowfullscreen></iframe>
  </div>

  <footer>
    Updated live from 
    <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vT9SS2QzLsosOmZnLZVXzIbzJQyqiIoYbPWoCkMF2RnOvtREYGBMxtBVWnRv6JME6sg11Yn9lw2s2Ft/pubhtml?widget=trueIFRAME_SECRET_URL_PLACEHOLDERamp;headers=false_FOOTER" target="_blank">
      Google Sheet
    </a>
  </footer>

  <script>
    function checkPassword() {
      // NOTE: The password "7437" is still visible in the source code!
      const correctPassword = "7437"; 
      const input = document.getElementById("passwordInput").value.trim();
      const error = document.getElementById("errorMessage");

      if (input === correctPassword) {
        document.getElementById("passwordScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
      } else {
        error.style.display = "block";
        setTimeout(() => { error.style.display = "none"; }, 2000);
      }
    }
  </script>
</body>
</html>
